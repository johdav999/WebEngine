name: RPG library
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone RPG and module tests
        run: cmake -S examples/rpg -B build/rpg-sdk -DWEBENGINE_SOURCE_DIR="${{ github.workspace }}" -DWEBENGINE_BUILD_RPG=ON -DWEBENGINE_BUILD_RPG_TESTS=ON -DWEBENGINE_BUILD_MODULE_TESTS=ON -DWEBENGINE_BUILD_QUESTS=ON -DWEBENGINE_BUILD_QUEST_TESTS=ON -DWEBENGINE_BUILD_RPG_QUESTS=ON
      - run: cmake --build build/rpg-sdk --config Release --parallel 2
      - run: ctest --test-dir build/rpg-sdk -C Release --output-on-failure
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          .tools/emsdk/emsdk install "$(cat .emscripten-version)"
          .tools/emsdk/emsdk activate "$(cat .emscripten-version)"
      - name: Configure, build and test standalone Wasm and omission matrix
        run: |
          source .tools/emsdk/emsdk_env.sh
          emcmake cmake -S examples/rpg -B build/rpg-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEBENGINE_SOURCE_DIR="$PWD" -DWEBENGINE_BUILD_RPG=ON -DWEBENGINE_BUILD_RPG_TESTS=ON -DWEBENGINE_BUILD_MODULE_TESTS=ON -DWEBENGINE_BUILD_QUESTS=ON -DWEBENGINE_BUILD_QUEST_TESTS=ON -DWEBENGINE_BUILD_RPG_QUESTS=ON
          cmake --build build/rpg-sdk --parallel 2
          ctest --test-dir build/rpg-sdk --output-on-failure
