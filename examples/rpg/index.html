<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPG · Training Court</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111c26;color:#eaf1f5;font:15px system-ui}main{display:grid;grid-template-columns:300px 1fr;height:100vh}aside{padding:24px;background:#182936;overflow:auto}h1{font-size:25px;margin:6px 0 20px}small{color:#a7c4d5;text-transform:uppercase;letter-spacing:2px}p{line-height:1.5}#values{min-height:95px;color:#aee5ed}#message{min-height:44px;color:#ffd18a}nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:12px 8px;border:1px solid #4d7186;border-radius:6px;background:#234050;color:#eef6fb;cursor:pointer}button:hover{background:#365c70}button:disabled{opacity:.45}canvas{width:100%;height:100%;min-width:0;touch-action:none;display:block}footer{margin-top:20px;color:#a7bdcc;font-size:12px}@media(max-width:700px){main{grid-template-columns:230px 1fr}aside{padding:12px}}</style></head>
<body><main><aside><small>WebEngine RPG sample</small><h1>Training Court</h1><p id="values">Loading the practice arena…</p><p id="message">Preparing renderer</p><nav id="actions"></nav><footer>Drag the view to orbit. Scroll to zoom.<br>Space: end turn · M: move · A: strike<br>Combat advances only when you act.<br>Blue: scholar · Orange: partner.<br>Inventory: blade and tonic stacks.</footer></aside><canvas id="viewport" tabindex="0" aria-label="Third-person 3D training court"></canvas></main><script src="host.js"></script><script async src="rpg_demo.js"></script></body></html>
